<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gestion des promos</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#EEF1F4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Promos" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  :root {
    --ink: #1A2433;
    --muted: #667085;
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --border: #DDE2E8;
    --accent: #1F4E79;
    --tag: #8A6116;
    --warn: #A6432E;
    --ok: #2F5D45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    font-size: 14px;
    line-height: 1.45;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 70px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .brand-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .export-col { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; background: var(--surface); color: var(--ink); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 10px 14px; font-size: 14px; }
  input[type=text], input[type=date], select {
    width: 100%; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field { flex: 1; min-width: 0; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .kpi .kpi-label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .kpi .kpi-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .kpi-value.warn { color: var(--warn); }
  .kpi .kpi-value.good { color: var(--ok); }
  .section-title { font-size: 14px; font-weight: 700; margin: 22px 0 10px; padding-left: 10px; border-left: 3px solid var(--accent); }
  .reminder-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--tag); background: #FBF3E2; border: 1px solid #EBD9A8; border-radius: 4px; padding: 9px 12px; margin-bottom: 10px; }
  .promo-card { border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); }
  .promo-card.status-cours { border-left-color: var(--ok); }
  .promo-card.status-couverture { border-left-color: #1F6E7A; }
  .promo-card.status-venir { border-left-color: var(--accent); }
  .promo-card.status-finie { border-left-color: var(--muted); opacity: 0.7; }
  .promo-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 10px; }
  .status-chip { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .status-chip.cours { background: #E7F0EA; color: var(--ok); }
  .status-chip.couverture { background: #E1EEF2; color: #1F6E7A; }
  .status-chip.venir { background: #E5EDF3; color: var(--accent); }
  .status-chip.finie { background: #EEE; color: var(--muted); }
  .del { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 9px; border-radius: 4px; }
  .stat-block .stat-lbl { font-size: 10.5px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
  .stat-block .stat-val { font-size: 14px; font-weight: 700; }
  .old-price { font-size: 11px; text-decoration: line-through; color: var(--muted); font-weight: 500; margin-right: 3px; }
  .note { font-size: 12.5px; color: var(--muted); }
  .analysis { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12.5px; }
  .analysis .title { font-weight: 700; font-size: 12.5px; margin-bottom: 3px; }
  .warn-text { color: var(--warn); }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff !important; }
    .wrap { padding: 0 !important; }
  }
</style>
</head>
<body>

  "Cresson": { jours: 3, temp: "2 à 7°C" }, "Endive": { jours: 7, temp: "4 à 8°C, à l'abri de la lumière" }, "Chicorée": { jours: 7, temp: "4 à 8°C" },

  "Céleri branche": { jours: 14, temp: "4 à 8°C" }, "Fenouil": { jours: 7, temp: "4 à 8°C" }, "Rhubarbe": { jours: 7, temp: "2 à 7°C" },

  "Maïs doux": { jours: 3, temp: "4 à 8°C" }, "Champignon de Paris": { jours: 5, temp: "1 à 4°C" }, "Champignon shiitake": { jours: 5, temp: "1 à 4°C" },

  "Fraise": { jours: 3, temp: "4 à 8°C" }, "Framboise": { jours: 2, temp: "2 à 7°C" }, "Myrtille": { jours: 7, temp: "2 à 7°C" },

  "Raisin blanc": { jours: 7, temp: "4 à 8°C" }, "Raisin noir": { jours: 7, temp: "4 à 8°C" }, "Raisin muscat": { jours: 7, temp: "4 à 8°C" },
  "Melon charentais": { jours: 7, temp: "8 à 12°C" }, "Melon galia": { jours: 7, temp: "8 à 12°C" }, "Pastèque": { jours: 14, temp: "8 à 12°C" }, "Pastèque jaune": { jours: 14, temp: "8 à 12°C" },

  "Kiwi vert": { jours: 21, temp: "8 à 12°C" }, "Kiwi jaune": { jours: 14, temp: "8 à 12°C" }, "Fruit de la passion": { jours: 14, temp: "12 à 15°C" },
  "Litchi": { jours: 7, temp: "6 à 10°C" }, "Ramboutan": { jours: 5, temp: "6 à 10°C" }, "Longane": { jours: 5, temp: "6 à 10°C" }, "Goyave": { jours: 5, temp: "12 à 15°C" },
  "Grenade": { jours: 21, temp: "8 à 12°C" }, "Figue": { jours: 3, temp: "2 à 7°C" }, "Figue de Barbarie": { jours: 7, temp: "8 à 12°C" },
  "Corossol": { jours: 5, temp: "12 à 15°C" }, "Carambole": { jours: 7, temp: "12 à 15°C" }, "Jacquier": { jours: 5, temp: "12 à 15°C" },
  "Fruit du dragon (pitaya)": { jours: 7, temp: "12 à 15°C" }, "Tamarillo": { jours: 14, temp: "8 à 12°C" }, "Kaki (plaquemine)": { jours: 7, temp: "4 à 8°C" },
  "Datte fraîche": { jours: 30, temp: "0 à 4°C" }, "Noix de coco": { jours: 30, temp: "13 à 18°C" }, "Avocat": { jours: 5, temp: "8 à 12°C (4 à 7°C une fois mûr)" },
};
const PRODUITS_NOMS = Object.keys(PRODUITS_CONSERVATION).sort((a, b) => a.localeCompare(b, "fr"));

let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || [];
let safetyMargin = localStorage.getItem(SAFETY_KEY) || "15";
let objectifRentabilite = localStorage.getItem("promo_objectif_rentabilite_v1") || "15";
let editingId = null;
let calendarWeekOffset = 0;

// Synchronisation cloud (Firebase Firestore) — même principe que le comparateur de prix.
let firebaseConfig = JSON.parse(localStorage.getItem("promo_firebase_config_v1") || "null");
let syncId = localStorage.getItem("promo_sync_id_v1") || "";
let fbDb = null;
let syncStatus = "";

function initFirebase() {
  if (!firebaseConfig || !syncId) return false;
  if (typeof firebase === "undefined") { syncStatus = "error"; return false; }
  try {
    if (!fbDb) {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      fbDb = firebase.firestore();
    }
    return true;
  } catch (e) { syncStatus = "error"; return false; }
}
function pullFromCloud() {
  if (!initFirebase()) return;
  syncStatus = "syncing";
  fbDb.collection("gestion_promos").doc(syncId).get().then(doc => {
    if (doc.exists) {
      const data = doc.data();
      if (Array.isArray(data.products)) products = data.products;
      if (data.safetyMargin) safetyMargin = data.safetyMargin;
      if (data.objectifRentabilite) objectifRentabilite = data.objectifRentabilite;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }
    syncStatus = "ok";
    render();
  }).catch(() => { syncStatus = "error"; render(); });
}
function pushToCloud() {
  if (!initFirebase()) return;
  syncStatus = "syncing";
  fbDb.collection("gestion_promos").doc(syncId).set({
    products, safetyMargin, objectifRentabilite, updatedAt: new Date().toISOString(),
  }).then(() => { syncStatus = "ok"; render(); }).catch(() => { syncStatus = "error"; render(); });
}
function configureSync() {
  const configStr = prompt("Colle ici la configuration Firebase (firebaseConfig, au format JSON) :", firebaseConfig ? JSON.stringify(firebaseConfig) : "");
  if (configStr === null) return;
  try { firebaseConfig = JSON.parse(configStr); } catch (e) { alert("JSON invalide."); return; }
  localStorage.setItem("promo_firebase_config_v1", JSON.stringify(firebaseConfig));
  const id = prompt("Choisis un code de synchronisation (à retaper à l'identique sur chaque appareil) :", syncId);
  if (id === null) return;
  syncId = id.trim();
  localStorage.setItem("promo_sync_id_v1", syncId);
  fbDb = null;
  alert("Synchronisation configurée. Récupération des données...");
  pullFromCloud();
}
function disableSync() {
  if (!confirm("Désactiver la synchronisation cloud sur cet appareil ? Tes données restent en local.")) return;
  firebaseConfig = null; syncId = ""; fbDb = null; syncStatus = "";
  localStorage.removeItem("promo_firebase_config_v1");
  localStorage.removeItem("promo_sync_id_v1");
  render();
}
function manualSync() { pullFromCloud(); }

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
  localStorage.setItem(SAFETY_KEY, safetyMargin);
  localStorage.setItem("promo_objectif_rentabilite_v1", objectifRentabilite);
  if (firebaseConfig && syncId) pushToCloud();
}

function num(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return isFinite(n) ? n : null;
}
function euro(v) {
  const n = num(v);
  return n === null ? "—" : n.toFixed(2).replace(".", ",") + " €";
}
function pct(v) { return v.toFixed(1).replace(".", ",") + " %"; }
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function daysBetween(d1, d2) { return Math.round((new Date(d2) - new Date(d1)) / 86400000); }

function optionsHtml(list, selectedValue) {
  return list.map(o => `<option value="${o}" ${o === selectedValue ? "selected" : ""}>${o}</option>`).join("")
    + `<option value="__autre__" ${selectedValue === "__autre__" ? "selected" : ""}>Autre…</option>`;
}
function nameFieldHtml(currentName) {
  const inList = currentName && PRODUITS_NOMS.includes(currentName);
  const selectVal = currentName ? (inList ? currentName : "__autre__") : "";
  const customVal = currentName && !inList ? currentName : "";
  return `<div class="field">
    <label class="small">Nom du produit</label>
    <select id="f-name-select" onchange="onNameSelectChange(this)">
      <option value="" ${selectVal === "" ? "selected" : ""}>—</option>
      ${optionsHtml(PRODUITS_NOMS, selectVal)}
    </select>
    <input type="text" id="f-name-custom" value="${customVal}" placeholder="Préciser le nom du produit" style="display:${customVal ? "block" : "none"};margin-top:6px;" />
  </div>`;
}
function onNameSelectChange(selectEl) {
  const custom = document.getElementById("f-name-custom");
  custom.style.display = selectEl.value === "__autre__" ? "block" : "none";
  if (selectEl.value !== "__autre__") custom.value = "";
}
function selectedName() {
  const sel = val("f-name-select");
  return sel === "__autre__" ? val("f-name-custom").trim() : sel;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return toISODate(d);
}

function computeStockAdvice(p) {
  const venteJour = num(p.venteJour);
  const dureePromo = p.dateDebut && p.dateFin ? daysBetween(p.dateDebut, p.dateFin) + 1 : null;
  const conservation = PRODUITS_CONSERVATION[p.name] ? PRODUITS_CONSERVATION[p.name].jours : num(p.conservationManuelle);
  const margeSecurite = num(safetyMargin) ?? 15;
  if (venteJour === null || venteJour <= 0 || dureePromo === null || conservation === null) return null;

  const besoinNormalPromo = Math.ceil(venteJour * dureePromo);
  const joursDisponiblesApresPromo = Math.max(0, conservation - dureePromo);
  const stockSupplementaire = Math.floor(joursDisponiblesApresPromo * venteJour * (1 - margeSecurite / 100));
  const total = besoinNormalPromo + stockSupplementaire;
  const risque = conservation <= dureePromo;

  // Rythme de vente utilisé pour écouler le stock supplémentaire une fois la promo
  // officiellement terminée (le rythme "hors promo" si connu, sinon celui de la promo).
  const venteJourApres = num(p.venteJourNormal) !== null && num(p.venteJourNormal) > 0 ? num(p.venteJourNormal) : venteJour;
  const joursCouvertureSupp = stockSupplementaire > 0 && venteJourApres > 0 ? Math.ceil(stockSupplementaire / venteJourApres) : 0;
  const dateFinCouverture = p.dateFin ? addDays(p.dateFin, joursCouvertureSupp) : null;

  return { dureePromo, conservation, besoinNormalPromo, stockSupplementaire, total, risque, joursDisponiblesApresPromo, joursCouvertureSupp, dateFinCouverture };
}

function computeStatus(p, adv) {
  const today = todayStr();
  if (!p.dateDebut || !p.dateFin) return { statut: "inconnu", joursRestants: null };
  if (today < p.dateDebut) return { statut: "venir", joursRestants: daysBetween(today, p.dateDebut) };
  if (today <= p.dateFin) return { statut: "cours", joursRestants: daysBetween(today, p.dateFin) };
  if (adv && adv.dateFinCouverture && today <= adv.dateFinCouverture) {
    return { statut: "couverture", joursRestants: daysBetween(today, adv.dateFinCouverture) };
  }
  return { statut: "finie", joursRestants: null };
}

// Rentabilité : compare le bénéfice attendu pendant la promo à celui qu'aurait
// généré la vente normale sur la même période, et calcule le volume nécessaire
// pour atteindre un objectif de rentabilité supérieure (ex. +15%).
function computeRentabilite(p) {
  const achatNormal = num(p.achatNormal);
  const venteNormal = num(p.venteNormal);
  const achatPromo = num(p.achatPromo) !== null ? num(p.achatPromo) : achatNormal;
  const ventePromo = num(p.ventePromo);
  const venteJourNormal = num(p.venteJourNormal);
  const venteJourPromo = num(p.venteJour);
  const dureePromo = p.dateDebut && p.dateFin ? daysBetween(p.dateDebut, p.dateFin) + 1 : null;
  if (achatNormal === null || venteNormal === null || achatPromo === null || ventePromo === null || dureePromo === null) return null;

  const margeUnitNormale = venteNormal - achatNormal;
  const margeUnitPromo = ventePromo - achatPromo;
  const objectifPct = num(objectifRentabilite) ?? 15;

  let rentabiliteNormalePeriode = null, rentabiliteCible = null, rentabilitePromoAttendue = null,
      volumeTotalNecessaire = null, venteJourNecessaire = null, atteint = null;

  if (venteJourNormal !== null && venteJourNormal >= 0) {
    rentabiliteNormalePeriode = margeUnitNormale * venteJourNormal * dureePromo;
    rentabiliteCible = rentabiliteNormalePeriode * (1 + objectifPct / 100);
    if (margeUnitPromo > 0) {
      volumeTotalNecessaire = Math.ceil(rentabiliteCible / margeUnitPromo);
      venteJourNecessaire = Math.ceil(volumeTotalNecessaire / dureePromo);
    }
  }
  if (venteJourPromo !== null && venteJourPromo >= 0) {
    rentabilitePromoAttendue = margeUnitPromo * venteJourPromo * dureePromo;
  }
  if (rentabiliteCible !== null && rentabilitePromoAttendue !== null) {
    atteint = rentabilitePromoAttendue >= rentabiliteCible;
  }
  return { margeUnitNormale, margeUnitPromo, dureePromo, objectifPct, rentabiliteNormalePeriode, rentabiliteCible, rentabilitePromoAttendue, volumeTotalNecessaire, venteJourNecessaire, atteint };
}

// Rentabilité pendant les jours de couverture (après la fin officielle de la promo,
// pendant que le stock acheté moins cher permet de garder le prix bas) : compare
// le bénéfice réellement généré à ce qu'il aurait été si ces mêmes unités avaient
// été achetées et vendues au prix normal.
function computeCouvertureRentabilite(p, adv) {
  if (!adv || !adv.stockSupplementaire || adv.stockSupplementaire <= 0) return null;
  const achatNormal = num(p.achatNormal);
  const venteNormal = num(p.venteNormal);
  const achatPromo = num(p.achatPromo) !== null ? num(p.achatPromo) : achatNormal;
  const ventePromo = num(p.ventePromo);
  if (achatNormal === null || venteNormal === null || achatPromo === null || ventePromo === null) return null;

  const margeUnitPromo = ventePromo - achatPromo;
  const margeUnitNormale = venteNormal - achatNormal;
  const volume = adv.stockSupplementaire;

  const rentabiliteCouverturePromo = margeUnitPromo * volume;
  const rentabiliteCouvertureSiNormal = margeUnitNormale * volume;
  const ecart = rentabiliteCouverturePromo - rentabiliteCouvertureSiNormal;

  return { volume, joursCouvertureSupp: adv.joursCouvertureSupp, margeUnitPromo, margeUnitNormale, rentabiliteCouverturePromo, rentabiliteCouvertureSiNormal, ecart };
}

// Bilan réel : une fois la promo terminée et les ventes réelles renseignées,
// compare le volume et la rentabilité réels au volume prévu.
function computeBilan(p) {
  const venteReelle = num(p.venteReelle);
  if (venteReelle === null) return null;
  const dureePromo = p.dateDebut && p.dateFin ? daysBetween(p.dateDebut, p.dateFin) + 1 : null;
  const venteJourPromo = num(p.venteJour);
  const prevu = dureePromo !== null && venteJourPromo !== null ? Math.round(venteJourPromo * dureePromo) : null;
  const achatPromo = num(p.achatPromo) !== null ? num(p.achatPromo) : num(p.achatNormal);
  const ventePromo = num(p.ventePromo);
  const margeUnitPromo = achatPromo !== null && ventePromo !== null ? ventePromo - achatPromo : null;
  const rentabiliteReelle = margeUnitPromo !== null ? margeUnitPromo * venteReelle : null;
  const ecartVolumePct = prevu && prevu > 0 ? ((venteReelle - prevu) / prevu) * 100 : null;
  return { venteReelle, prevu, ecartVolumePct, rentabiliteReelle };
}

function getWeekStart(offset) {
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = (day === 0 ? -6 : 1) - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday + offset * 7);
  monday.setHours(0, 0, 0, 0);
  return monday;
}
function toISODate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportDataJson() {
  downloadBlob(JSON.stringify({ products, safetyMargin, objectifRentabilite, exportedAt: new Date().toISOString() }, null, 2),
    `promos-${todayStr()}.json`, "application/json");
}
function triggerImport() { document.getElementById("import-file-input").click(); }
function importDataJson(fileInput) {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.products)) throw new Error("format invalide");
      if (!confirm(`Importer ${data.products.length} promo(s) ? Cela remplacera tes données actuelles.`)) return;
      products = data.products;
      if (data.safetyMargin) safetyMargin = data.safetyMargin;
      if (data.objectifRentabilite) objectifRentabilite = data.objectifRentabilite;
      save(); render();
    } catch (e) { alert("Fichier invalide."); }
    fileInput.value = "";
  };
  reader.readAsText(file);
}
function csvField(v) { return `"${String(v == null ? "" : v).replace(/"/g, '""')}"`; }
function exportCsv() {
  const rows = [["Produit","Achat normal","Achat promo","Vente normal","Vente promo","Début","Fin","Statut","Prix bas jusqu'au","Vente/jour normal","Vente/jour promo","Ventes réelles","Stock supplémentaire conseillé","Total à commander"]];
  products.forEach(p => {
    const adv = computeStockAdvice(p);
    const s = computeStatus(p, adv);
    rows.push([p.name, p.achatNormal, p.achatPromo, p.venteNormal, p.ventePromo, p.dateDebut, p.dateFin,
      s.statut, adv ? adv.dateFinCouverture : "", p.venteJourNormal, p.venteJour, p.venteReelle, adv ? adv.stockSupplementaire : "", adv ? adv.total : ""]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(csvField).join(";")).join("\r\n");
  downloadBlob(csv, `promos-${todayStr()}.csv`, "text/csv;charset=utf-8;");
}

        <div class="title">Anticipation de stock</div>
        ${adv.risque
          ? `<div class="note warn-text">Conservation (${adv.conservation}j) trop courte pour la durée de la promo (${adv.dureePromo}j) — commande juste le nécessaire : ${adv.besoinNormalPromo} unité(s), pas de surplus sûr.</div>`
          : `<div class="note">Commande pour la promo : <b>${adv.besoinNormalPromo}</b> · Stock supplémentaire prudent : <b>${adv.stockSupplementaire}</b> · Total conseillé : <b>${adv.total} unité(s)</b></div>`}
        ${!adv.risque && adv.stockSupplementaire > 0 ? `<div class="note" style="color:#1F6E7A;">Grâce à ce stock, tu peux garder le prix promo jusqu'au <b>${adv.dateFinCouverture}</b> (${adv.joursCouvertureSupp} j de plus après la fin officielle de la promo) — sans que ça ressorte comme un écart dans Gold, puisque le prix d'achat correspond bien à ce que tu as payé.</div>` : ""}
        ${conservationRef ? `<div class="note">Référence conservation : ${conservationRef.jours}j à ${conservationRef.temp}</div>` : ""}
      </div>` : `<div class="analysis"><div class="note">Renseigne la vente moyenne/jour pour obtenir une recommandation de stock.</div></div>`}
      ${rentCouv ? `
      <div class="analysis">
        <div class="title">Rentabilité pendant la couverture (${rentCouv.joursCouvertureSupp} j, ${rentCouv.volume} unité(s))</div>
        <div class="note">En gardant le prix promo (${euro(rentCouv.margeUnitPromo)}/unité) : <b>${euro(rentCouv.rentabiliteCouverturePromo)}</b></div>
        <div class="note">Si acheté et vendu au prix normal (${euro(rentCouv.margeUnitNormale)}/unité) : <b>${euro(rentCouv.rentabiliteCouvertureSiNormal)}</b></div>
        <div class="note" style="color:${rentCouv.ecart >= 0 ? "var(--ok)" : "var(--warn)"};">${rentCouv.ecart >= 0
          ? `Tu gagnes ${euro(rentCouv.ecart)} de plus qu'au prix normal, tout en restant compétitif.`
          : `Ça te coûte ${euro(-rentCouv.ecart)} de marge par rapport au prix normal — c'est le prix à payer pour rester compétitif sur cette période.`}</div>
      </div>` : ""}
      ${rent ? `
      <div class="analysis">
        <div class="title">Rentabilité (sur ${rent.dureePromo} j)</div>
        ${rent.rentabiliteNormalePeriode !== null ? `<div class="note">Rentabilité normale sur cette période : <b>${euro(rent.rentabiliteNormalePeriode)}</b> · Objectif avec promo (+${rent.objectifPct}%) : <b>${euro(rent.rentabiliteCible)}</b></div>` : `<div class="note">Renseigne la vente/jour hors promo pour comparer à la rentabilité normale.</div>`}
        ${rent.rentabilitePromoAttendue !== null ? `<div class="note">Rentabilité attendue avec ton volume promo actuel : <b style="color:${rent.atteint ? "var(--ok)" : "var(--warn)"};">${euro(rent.rentabilitePromoAttendue)}</b> ${rent.atteint === true ? "— objectif atteint" : rent.atteint === false ? "— objectif non atteint" : ""}</div>` : ""}
        ${rent.volumeTotalNecessaire !== null ? `<div class="note">Volume total nécessaire pour l'objectif : <b>${rent.volumeTotalNecessaire} unité(s)</b> sur la promo, soit environ <b>${rent.venteJourNecessaire}/jour</b>.</div>` : ""}
      </div>` : ""}
    </div>`;
  });

  if (terminees.length > 0) {
    html += `<div class="section-title">Historique des promos terminées</div>`;
    terminees.forEach(p => {
      const bilan = computeBilan(p);
      html += `<div class="promo-card status-finie">
        <div class="promo-top">
          <div>
            <div style="font-size:14.5px;font-weight:700;">${p.name}</div>
            <div class="note">${p.dateDebut} → ${p.dateFin}</div>
          </div>
          <div class="row no-print" style="gap:6px;">
            <button class="del" onclick="editProduct(${p.id})">Modifier</button>
            <button class="del" onclick="removeProduct(${p.id})">Supprimer</button>
          </div>
        </div>
        <div class="row no-print" style="gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px;">
          <div class="field" style="flex:0 0 160px;"><label class="small">Ventes réelles (unités)</label><input type="text" id="hist-vente-reelle-${p.id}" value="${p.venteReelle || ""}" inputmode="numeric" /></div>
          <button class="btn" style="flex:0 0 110px;" onclick="saveVenteReelle(${p.id})">Enregistrer</button>
        </div>
        ${bilan ? `
        <div class="analysis">
          <div class="title">Bilan réel vs prévu</div>
          <div class="note">Ventes réelles : <b>${bilan.venteReelle}</b>${bilan.prevu !== null ? ` sur ${bilan.prevu} prévues` : ""}${bilan.ecartVolumePct !== null ? ` (${bilan.ecartVolumePct >= 0 ? "+" : ""}${pct(bilan.ecartVolumePct)})` : ""}</div>
          ${bilan.rentabiliteReelle !== null ? `<div class="note">Rentabilité réelle générée : <b>${euro(bilan.rentabiliteReelle)}</b></div>` : ""}
        </div>` : `<div class="analysis"><div class="note">Renseigne les ventes réelles pour voir le bilan.</div></div>`}
      </div>`;
    });
  }

  document.getElementById("root").innerHTML = html;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

render();

if (firebaseConfig && syncId) {
  pullFromCloud();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
